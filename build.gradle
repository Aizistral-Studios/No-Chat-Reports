task curseforge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	println("[Fabric] Pushing CurseForgeGradle specifications for project ID: ${curse_id}")
	disableVersionDetection()
	
	apiToken = findProperty('curseKey') ?: '0'
	
	def projectId = project.curse_id
	def mainFile = upload(projectId, jar)
	
	mainFile.changelogType = 'markdown'
	mainFile.changelog = rootProject.file("docs/CHANGELOG.md").text
	mainFile.releaseType = "${version_type}"
	
	mainFile.addModLoader('Fabric')
	mainFile.addJavaVersion('Java 25')
	mainFile.addGameVersion(project.minecraft_version)
	
	mainFile.addRequirement('fabric-api')
	mainFile.addOptional('modmenu')
	mainFile.addOptional('cloth-config')
}

modrinth {
    token = findProperty('modrinthKey') ?: 'none'
    projectId = "no-chat-reports"
    versionNumber = "Fabric-" + project.mod_version
	versionName = "No Chat Reports Fabric-" + project.mod_version
    versionType = "${version_type}"
	changelog = rootProject.file("docs/CHANGELOG.md").text
    uploadFile = jar
    gameVersions = [ project.minecraft_version ]
	loaders = ['fabric']
	
	dependencies {
		// The scope can be `required`, `optional`, or `incompatible`
		required.project "fabric-api"
		optional.project "modmenu"
		optional.project "cloth-config"
    }
	
	syncBodyFrom = rootProject.file("docs/README.md").text
}

tasks.modrinth.dependsOn(tasks.modrinthSyncBody)

afterEvaluate {
	upload.dependsOn(jar)
}

task upload {
	dependsOn('modrinth')
	dependsOn('curseforge')
}
