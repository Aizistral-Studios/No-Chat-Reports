import org.apache.tools.ant.taskdefs.condition.Os
import java.nio.file.*

plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
	id 'net.darkhax.curseforgegradle' version '1.+'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def createLink(String source, String target) {
	def sourceFile = file(source).toPath().toAbsolutePath()
	def targetFile = file(target).toPath().toAbsolutePath()

	if (Files.exists(targetFile)) {
		println("Target ${target} already exists, skipping symbolic link creation")
		return
	}

	try {
		Files.createDirectories(targetFile.parent)
		Files.createSymbolicLink(targetFile, sourceFile)
		println("Creating link from ${source} to ${target}")
	} catch (Exception e) {
		println("Failed to create symlink from ${source} to ${target}: ${e.message}")
	}
}

def setupLinks() {
	println("Setting up symbolic links...")

	for (platform in ["forge", "neoforge"]) {
		createLink("src/main/java/com/aizistral/nochatreports/common", "${platform}/src/main/java/com/aizistral/nochatreports/common")
		createLink("src/main/resources/assets", "${platform}/src/main/resources/assets")
		createLink("src/main/resources/mixins/common", "${platform}/src/main/resources/mixins/common")

		if (!file("${platform}/src/main/java/com/aizistral/nochatreports/common/platform/PlatformProvider.java").exists()) {
			throw new IllegalStateException("No PlatformProvider found :/")
		}
	}

	createLink("forge/deps", "neoforge/deps")
}

setupLinks()

java {
	// withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

loom {
	accessWidenerPath = file("src/main/resources/nochatreports.classtweaker")
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url file("deps") }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
	api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand 'mod_license': mod_license, 
		'version': version, 
		'mod_id' : mod_id, 
		'mod_name': mod_name, 
		'mod_url': mod_url, 
		'mod_author': mod_author, 
		'mod_icon': mod_icon, 
		'mod_description': mod_description,
		'issue_tracker_url': issue_tracker_url,
		'contributor_0': contributor_0,
		'contributor_1': contributor_1,
		'contributor_2': contributor_2,
		'fabric_loader_version': fabric_loader_version,
		'minecraft_version': minecraft_version
	}

    from("${rootProject.projectDir}/docs") {
        include 'CHANGELOG.md'
    }
	
	from("${rootProject.projectDir}") {
        include 'LICENSE'
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// withSourcesJar()
}

